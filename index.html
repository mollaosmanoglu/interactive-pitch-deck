<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luphra Pitch Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/base.css" />
  </head>
  <body>
    <main class="deck" aria-label="Luphra interactive pitch deck">
      <div class="stage-wrapper" id="stageWrapper">
      <section class="stage" id="stage">
      </section>
      </div>

      <nav class="controls" aria-label="Deck controls">
        <button class="icon-button" id="prev" type="button" aria-label="Previous slide">←</button>
        <div class="progress" id="progress" aria-label="Slide progress"></div>
        <button class="icon-button" id="next" type="button" aria-label="Next slide">→</button>
      </nav>
    </main>

    <script type="module" src="src/deck.js"></script>
  </body>
</html>
