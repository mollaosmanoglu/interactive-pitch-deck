<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MicroCover Pitch Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/base.css" />
  </head>
  <body>
    <main class="deck" aria-label="MicroCover interactive pitch deck">
      <div class="stage-wrapper" id="stageWrapper">
      <section class="stage" id="stage">
      </section>
      </div>

      <nav class="controls" aria-label="Deck controls">
        <button class="icon-button" id="prev" type="button" aria-label="Previous slide">←</button>
        <div class="progress" id="progress" aria-label="Slide progress"></div>
        <button class="icon-button" id="next" type="button" aria-label="Next slide">→</button>
        <button class="icon-button" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
          <svg id="enterFullscreenIcon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
          </svg>
          <svg id="exitFullscreenIcon" aria-hidden="true" viewBox="0 0 24 24" hidden>
            <path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5" />
          </svg>
        </button>
      </nav>
    </main>

    <script type="module" src="src/deck.js"></script>
  </body>
</html>
